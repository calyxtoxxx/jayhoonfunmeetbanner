<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Scan the banner and the film plays on top of it.">
<link rel="icon" href="data:,">
<title>AR Experience</title>

<!-- Library scripts must load in the head: A-Frame upgrades <a-scene> the moment it
     is defined, so all core systems and components have to be registered by then. -->
<script src="./vendor/aframe-v1.5.0.min.js"></script>
<script src="./vendor/mindar-image-aframe.prod.js"></script>

<style>
  :root{--cyan:#22e0ff;--mag:#ff2fb9;--ink:#04060c;--mono:ui-monospace,Consolas,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:#eaf6ff;overflow:hidden;
            font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .hidden{display:none !important}

  /* the film lives off-screen: it must stay renderable for the video texture,
     but never take up space or paint over the AR view */
  #media{position:fixed;left:-20px;top:-20px;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;text-align:center;padding:26px;gap:20px}

  /* 1. start (one tap: camera permission + audio unlock) */
  #start{z-index:30;background:
      radial-gradient(120% 80% at 18% 0%, rgba(34,224,255,.18), transparent 60%),
      radial-gradient(120% 80% at 88% 8%, rgba(255,47,185,.16), transparent 60%),
      linear-gradient(180deg,#04060c,#0a1020 60%,#04060c)}
  #start h1{margin:0;font-size:clamp(30px,9vw,54px);line-height:1;font-weight:800;letter-spacing:.02em;
            text-transform:uppercase;background:linear-gradient(92deg,#fff,#22e0ff 45%,#ff2fb9);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  #start p{margin:0;max-width:23rem;color:#a9c3d8;font-size:15px;line-height:1.6}
  #startBtn{appearance:none;border:0;cursor:pointer;color:#02121a;font:700 15px/1 var(--mono);
            letter-spacing:.2em;text-transform:uppercase;padding:18px 36px;border-radius:999px;
            background:linear-gradient(92deg,#22e0ff,#7ef0ff 40%,#ff2fb9);
            box-shadow:0 12px 40px rgba(34,224,255,.35)}

  /* 2. scanning prompt (MindAR shows/hides this via the `hidden` class) */
  #scan{z-index:15;pointer-events:none}
  #scan .frame{position:relative;width:min(72vw,300px);aspect-ratio:1/1}
  #scan .frame i{position:absolute;width:34px;height:34px;border:2px solid var(--cyan);
                 filter:drop-shadow(0 0 10px rgba(34,224,255,.7))}
  #scan .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:8px}
  #scan .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:8px}
  #scan .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:8px}
  #scan .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:8px}
  #scan p{margin:0;font:600 12px/1.6 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:#bfe9ff}

  /* errors: a line of text, nothing else */
  #error{z-index:40;background:rgba(4,6,12,.94)}
  #error p{margin:0;max-width:24rem;color:#cfe6f6;font-size:15px;line-height:1.6}
</style>
</head>
<body>

<!-- the film (off-screen, see #media above) -->
<div id="media">
  <video id="arVideo" src="./assets/video.mp4" preload="none"
         playsinline webkit-playsinline muted loop></video>
</div>

<!-- step 1: one tap to open the camera -->
<div id="start" class="screen">
  <h1>AR Exhibit</h1>
  <p>Point your camera at the artwork and the film plays on top of it.</p>
  <button id="startBtn">Start</button>
</div>

<!-- step 2: where to aim (MindAR's uiScanning slot) -->
<div id="scan" class="screen hidden">
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <p>Point your camera at the artwork</p>
</div>

<!-- errors -->
<div id="error" class="screen hidden"><p id="errorText"></p></div>

<!-- step 3: the film, anchored to the tracked artwork -->
<a-scene id="scene"
         mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiScanning: #scan; uiError: no; maxTrack: 1; missTolerance: 6; warmupTolerance: 4; filterMinCF: 0.0001; filterBeta: 0.01;"
         color-space="sRGB"
         renderer="antialias: true; colorManagement: true"
         xr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: false"
         loading-screen="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="anchor" mindar-image-target="targetIndex: 0">
    <a-entity id="group" scale="0.001 0.001 0.001">
      <!-- glow edge, sized to the artwork (3120 x 1110) -->
      <a-plane position="0 0 -0.004" width="1.05" height="0.3736"
               material="color: #22e0ff; shader: flat; transparent: true; opacity: 0.35; side: double"></a-plane>
      <!-- the film itself -->
      <a-video id="film" src="#arVideo" position="0 0 0.004" width="1" height="0.3558"></a-video>
    </a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  'use strict';

  var scene   = document.querySelector('#scene');
  var anchor  = document.querySelector('#anchor');
  var group   = document.querySelector('#group');
  var video   = document.querySelector('#arVideo');
  var start   = document.querySelector('#start');
  var scan    = document.querySelector('#scan');
  var error   = document.querySelector('#error');
  var errorTx = document.querySelector('#errorText');
  var ready   = false;
  var timer   = null;

  function fail(message) {
    errorTx.textContent = message;
    error.classList.remove('hidden');
    scan.classList.add('hidden');
  }

  /* ---- start: the single tap that opens the camera ------------------- */
  document.querySelector('#startBtn').addEventListener('click', function () {
    start.classList.add('hidden');

    /* load the film and unlock playback while we still have the tap
       (iOS only allows later playback for an element that has played once) */
    video.load();
    var priming = video.play();
    if (priming && priming.then) {
      priming.then(function () { video.pause(); video.currentTime = 0; }).catch(function () {});
    }

    try {
      scene.systems['mindar-image-system'].start();
    } catch (e) {
      fail('AR could not start: ' + e.message);
      return;
    }
    timer = setTimeout(function () {
      if (!ready) fail('The camera could not start. Allow camera access for this site (padlock icon) and serve the page over https:// or localhost.');
    }, 12000);
  });

  scene.addEventListener('arReady', function () { ready = true; clearTimeout(timer); });
  scene.addEventListener('arError', function () {
    clearTimeout(timer);
    fail('Camera access was blocked. Allow the camera for this site and reload.');
  });

  /* ---- artwork found: play the film on it ---------------------------- */
  anchor.addEventListener('targetFound', function () {
    group.removeAttribute('animation__pop');
    group.setAttribute('animation__pop', {
      property: 'scale', from: '0.6 0.6 0.6', to: '1 1 1', dur: 420, easing: 'easeOutBack'
    });

    video.muted = false;                 /* with sound when the browser allows it... */
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () {              /* ...otherwise play silently */
        video.muted = true;
        video.play().catch(function () {});
      });
    }
  });

  /* ---- artwork lost: hold the film where it is ----------------------- */
  anchor.addEventListener('targetLost', function () {
    video.pause();
  });
})();
</script>
</body>
</html>
