<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Point your camera at the artwork and the film plays on top of it.">
<link rel="icon" href="data:,">
<title>AR</title>

<!-- Library scripts must load in the head: A-Frame upgrades <a-scene> the moment it
     is defined, so all core systems and components have to be registered by then. -->
<script src="./vendor/aframe-v1.5.0.min.js"></script>
<script src="./vendor/mindar-image-aframe.prod.js"></script>

<style>
  :root{--cyan:#22e0ff;--ink:#04060c;--mono:ui-monospace,Consolas,"SF Mono",Menlo,monospace}

  /* The dark page colour must live on <html>, never on <body>: MindAR draws the camera
     <video> at z-index:-2 and an in-flow body background paints above negative-z-index
     children, which hides the camera feed behind a black page. */
  html{background:var(--ink)}
  body{margin:0;height:100%;background:transparent;color:#eaf6ff;overflow:hidden;
       font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .hidden{display:none !important}

  /* the film stays off-screen: renderable for the 3D texture, invisible to the user */
  #media{position:fixed;left:-20px;top:-20px;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}

  /* prompt over the live camera view */
  #scan{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:22px;pointer-events:none;padding:26px;text-align:center}
  #scan .frame{position:relative;width:min(72vw,300px);aspect-ratio:1/1}
  #scan .frame i{position:absolute;width:34px;height:34px;border:2px solid var(--cyan);
                 filter:drop-shadow(0 0 10px rgba(34,224,255,.7))}
  #scan .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:8px}
  #scan .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:8px}
  #scan .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:8px}
  #scan .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:8px}
  #scan p{margin:0;font:600 12px/1.6 var(--mono);letter-spacing:.28em;text-transform:uppercase;
          color:#bfe9ff;text-shadow:0 2px 12px #000;max-width:26rem}

  /* only shown when the camera really cannot open by itself */
  #error{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:20px;background:rgba(4,6,12,.92);padding:26px;text-align:center}
  #error p{margin:0;max-width:26rem;color:#cfe6f6;font-size:15px;line-height:1.6}
  #retry{cursor:pointer;border:0;border-radius:999px;padding:18px 32px;color:#02121a;background:#22e0ff;
         font:700 14px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>

<!-- the film (off-screen, feeds the 3D texture) -->
<div id="media">
  <video id="arVideo" src="./assets/video.mp4" preload="auto"
         playsinline webkit-playsinline muted loop></video>
</div>

<div id="scan">
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <p id="scanText">Starting camera&hellip;</p>
</div>

<div id="error" class="hidden">
  <p id="errorText"></p>
  <button id="retry">Tap to open the camera</button>
</div>

<a-scene id="scene"
         mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; missTolerance: 6; warmupTolerance: 4; filterMinCF: 0.0001; filterBeta: 0.01;"
         color-space="sRGB"
         renderer="alpha: true; antialias: true; colorManagement: true"
         xr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: false"
         loading-screen="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="anchor" mindar-image-target="targetIndex: 0">
    <a-entity id="group" scale="0.001 0.001 0.001">
      <a-plane position="0 0 -0.004" width="1.05" height="0.3736"
               material="color: #22e0ff; shader: flat; transparent: true; opacity: 0.35; side: double"></a-plane>
      <a-video id="film" src="#arVideo" position="0 0 0.004" width="1" height="0.3558"></a-video>
    </a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  'use strict';

  var scene    = document.querySelector('#scene');
  var anchor   = document.querySelector('#anchor');
  var group    = document.querySelector('#group');
  var video    = document.querySelector('#arVideo');
  var scan     = document.querySelector('#scan');
  var scanText = document.querySelector('#scanText');
  var error    = document.querySelector('#error');
  var errorTx  = document.querySelector('#errorText');
  var retry    = document.querySelector('#retry');
  var ready    = false;
  var opened   = false;
  var timer    = null;
  var SCAN_TEXT = 'Point your camera at the artwork';

  function system() { return scene.systems && scene.systems['mindar-image-system']; }
  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  /* ---- sharper camera than MindAR's default ---------------------------------
     MindAR only asks for {facingMode:'environment'}, which phones answer with a low-res
     stream (typically 640x480). Ask for 1080p@30; the browser falls back to what the
     device supports. The patch is optional - a failure here must never kill the page. */
  try {
    var md = navigator.mediaDevices;
    if (md && md.getUserMedia) {
      var original = md.getUserMedia.bind(md);
      md.getUserMedia = function (constraints) {
        var v = constraints && constraints.video;
        if (v && typeof v === 'object') {
          if (!v.width)     v.width     = { ideal: 1920 };
          if (!v.height)    v.height    = { ideal: 1080 };
          if (!v.frameRate) v.frameRate = { ideal: 30 };
        }
        /* remember why it failed so the message we show is useful */
        return original(constraints).catch(function (err) {
          window.__camError = (err && err.name) || 'Error';
          throw err;
        });
      };
    }
  } catch (e) { /* ignore: quality patch is best-effort */ }

  function inAppBrowser() {
    var ua = navigator.userAgent || '';
    return /FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|MicroMessenger|Twitter|LinkedIn/i.test(ua);
  }

  function reason() {
    var name = window.__camError;
    if (inAppBrowser()) {
      return 'The in-app browser blocks the camera. Open this page in Safari or Chrome (menu, then Open in browser).';
    }
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
      return 'Camera access is blocked for this site. Tap the padlock (or lock icon) in the address bar, allow Camera, then reload.';
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') {
      return 'No usable camera was found on this device.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return 'The camera is busy in another app or tab. Close it and tap below.';
    }
    return 'The camera did not open.';
  }

  /* Fallback only: shown when the browser will not open the camera without a tap
     (older iOS) or when it was blocked. */
  function offerTap() {
    hide(scan);
    errorTx.textContent = reason();
    show(error);
  }

  function openCamera() {
    var s = system();
    if (!s || opened) return;
    opened = true;
    hide(error);
    scanText.textContent = 'Starting camera...';
    show(scan);
    video.load();
    try {
      s.start();
    } catch (e) {
      window.__camError = 'StartError';
      offerTap();
      return;
    }
    clearTimeout(timer);
    timer = setTimeout(function () { if (!ready) offerTap(); }, 8000);
  }

  /* A-Frame finishes building the scene (and MindAR gets its config) shortly after load.
     Wait for that, then open the camera - no user gesture needed on most browsers. */
  (function boot() {
    var s = system();
    if (s && s.imageTargetSrc) openCamera();
    else setTimeout(boot, 100);
  })();

  scene.addEventListener('arReady', function () {
    ready = true;
    clearTimeout(timer);
    scanText.textContent = SCAN_TEXT;
    show(scan);
  });

  scene.addEventListener('arError', function () {
    clearTimeout(timer);
    opened = false;
    offerTap();
  });

  /* The retry MUST start the camera synchronously inside the click handler: browsers tie
     getUserMedia permission to the user gesture, so a setTimeout here breaks it. */
  retry.addEventListener('click', function () {
    hide(error);
    /* MindAR may have left a dead camera element behind - clear it so the retry is clean */
    var kids = document.body.children;
    for (var i = kids.length - 1; i >= 0; i--) {
      if (kids[i].tagName === 'VIDEO') kids[i].remove();
    }
    try { system().stop(); } catch (e) { /* not started: fine */ }
    opened = false;
    ready = false;
    openCamera();
  });

  /* ---- artwork found: play the film on it --------------------------------- */
  anchor.addEventListener('targetFound', function () {
    hide(scan);
    group.removeAttribute('animation__pop');
    group.setAttribute('animation__pop', {
      property: 'scale', from: '0.6 0.6 0.6', to: '1 1 1', dur: 420, easing: 'easeOutBack'
    });
    video.muted = false;                     /* with sound when allowed... */
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () {                  /* ...silently otherwise */
        video.muted = true;
        video.play().catch(function () {});
      });
    }
  });

  anchor.addEventListener('targetLost', function () {
    show(scan);
    video.pause();
  });

  /* First touch anywhere turns the sound on (autoplay starts muted on phones). */
  function unmute() {
    document.removeEventListener('touchstart', unmute);
    document.removeEventListener('click', unmute);
    if (!video.muted) return;
    video.muted = false;
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }
  document.addEventListener('touchstart', unmute);
  document.addEventListener('click', unmute);

  /* Never leave a dead screen: any unexpected error becomes a visible message. */
  window.addEventListener('error', function (e) {
    if (ready) return;
    window.__camError = window.__camError || 'ScriptError';
    offerTap();
  });
})();
</script>
</body>
</html>
